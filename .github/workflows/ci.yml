name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes gjs libglib2.0-bin zip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Shexli
        run: python -m pip install shexli

      - name: Run tests
        run: ./test.sh

      - name: Build extension package
        run: ./package.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: gnome-shell-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error
